<text x="78" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#15181C">A course at a time,</text>
<text x="78" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#15181C">or <tspan fill="#C0611A">rent and invest</tspan>.</text>
<text x="80" y="360" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="24" fill="#6B7069">Works out when you move in, whether you ever finish, and what it costs to wait.</text>

